services:
  postgres:
    image: postgres:16-alpine
    container_name: sb_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sb_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sb_system_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sb_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sb_system_postgres_data:
